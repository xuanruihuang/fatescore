[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fatescore"
version = "0.1.0"
description = "Score fate predictions against clonal fate, calibrated against a walk without direction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Xuanrui Huang"}]
dependencies = ["numpy", "scipy", "pandas", "scikit-learn"]

[tool.setuptools]
package-dir = {"" = "tool"}
packages = ["fatescore"]
